[package]
name = "ai-video-analizi"
version = "0.1.3"
description = "AI Video Analizi — kamera kaydı inceleme aracı"
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WebView2 çökme olayı ve güncelleyicinin süreç beklemesi (Tauri'nin kullandığı sürümlerle aynı)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
strip = true
lto = "thin"
